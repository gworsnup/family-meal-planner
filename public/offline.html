<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>FamilyTable is offline</title>
    <style>
      body { margin: 0; background: #fafaf9; color: #0f172a; font: 16px system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      section { max-width: 360px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; text-align: center; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.5; }
      button { margin-top: 22px; border: 0; border-radius: 999px; background: #0f172a; color: white; padding: 11px 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>You’re offline</h1>
        <p>Reconnect to load your latest FamilyTable plan and recipes.</p>
        <button onclick="location.reload()">Try again</button>
      </section>
    </main>
  </body>
</html>
